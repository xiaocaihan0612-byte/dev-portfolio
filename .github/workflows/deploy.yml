name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 仓库未提交 package-lock.json，且部分依赖存在 peer 冲突，故用 install + legacy-peer-deps
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      # 使用 GitHub Pages 专用构建模式（base = /dev-portfolio/），不影响阿里云用的 npm run build
      - name: Build website
        run: npm run build:ghpages

      # 让 /about、/projects 这类子路径直接刷新也能正常打开（交给前端路由处理）
      - name: Add SPA fallback page
        run: cp build/index.html build/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

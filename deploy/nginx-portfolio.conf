# /etc/nginx/sites-available/portfolio
# 个人作品集站点（Vite + React 构建产物，纯静态）
# 部署位置：/var/www/portfolio

server {
    listen 80;
    listen [::]:80;

    # 暂时用公网 IP 访问；以后绑了域名，把域名写在这里，并用空格分隔多个
    server_name 47.93.0.203;

    root /var/www/portfolio;
    index index.html;

    charset utf-8;
    client_max_body_size 20m;

    # 开启压缩，2.8MB 的包能压到 1MB 以内
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    # SPA 路由回退：/edit 这类前端路由刷新时交给 index.html 处理
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的构建产物，可以长期强缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 图片、字体等静态资源
    location ~* \.(jpg|jpeg|png|gif|webp|svg|ico|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # 入口文件和内容配置不缓存，保证改了 profile/*.json 立刻生效
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location /profile/ {
        add_header Cache-Control "no-cache";
    }

    access_log /var/log/nginx/portfolio.access.log;
    error_log  /var/log/nginx/portfolio.error.log;
}
